version: '3.8'

services:
  # Backend Server (Node.js/Express)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: schooly-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - schooly-network
    command: npm run dev

  # Frontend Client (Vite + React/Vue)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: schooly-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - schooly-network
    command: npm run dev

networks:
  schooly-network:
    driver: bridge
